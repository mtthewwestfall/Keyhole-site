<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071720">
<title>Keyhole — Private Live Connection</title>
<style>
:root{--night:#020c11;--paper:#071720;--panel:#102b35;--ink:#f6efdf;--muted:#bac7c8;--gold:#d9ad58;--bright:#f0c879;--line:rgba(246,239,223,.15)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#12313d 0,#071720 38%,#020c11 78%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:28px 20px}.cover{width:min(680px,100%);text-align:center;padding:54px 24px;border:1px solid var(--line);border-radius:22px;background:rgba(7,23,32,.84);box-shadow:0 28px 80px rgba(0,0,0,.4)}
.mark{width:58px;height:58px;margin:0 auto 22px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--bright);font-size:28px}
h1{margin:0;color:var(--bright);font-family:Georgia,serif;font-size:clamp(2.7rem,12vw,5rem);letter-spacing:.16em}p{margin:18px auto 30px;max-width:480px;color:var(--muted);font-size:1.05rem;line-height:1.6}
.enter{display:inline-block;padding:14px 28px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--bright));color:#071720;text-decoration:none;font-weight:800;letter-spacing:.04em}
.note{margin-top:22px;font-size:.78rem;color:#87999d}
</style>
</head>
<body><main><section class="cover" aria-label="Keyhole welcome">
<div class="mark">⌾</div><h1>KEYHOLE</h1>
<p>Private live connection, personal rooms, and real-time conversation. Enter when you’re ready.</p>

<div class="note">Private access • Live rooms • Personal connection</div>
</section></main></body></html>
