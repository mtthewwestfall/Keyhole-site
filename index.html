<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12100E">
<meta name="color-scheme" content="dark">
<title>KEYHOLE</title>
<link rel="stylesheet" href="house.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  if (localStorage.getItem('keyhole_auth_token_v1')) location.replace('rooms.html');
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    background: var(--charcoal);
    color: var(--ink);
    font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  button, input { font: inherit; }
  .night-still {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 40%;
    z-index: 0;
  }
  .night-shade {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(18, 16, 14, 0.42) 0%, rgba(18, 16, 14, 0.08) 28%, rgba(18, 16, 14, 0.18) 62%, rgba(18, 16, 14, 0.55) 100%),
      linear-gradient(90deg, rgba(18, 16, 14, 0.28), transparent 32%, transparent 68%, rgba(18, 16, 14, 0.2));
  }
  .house-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 28px 36px;
  }
  .house-name {
    font-size: 0.72rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--ink);
  }
  .house-actions {
    display: flex;
    align-items: center;
    gap: 26px;
  }
  .quiet {
    background: none;
    border: none;
    color: var(--stone);
    font-size: 0.92rem;
    cursor: pointer;
    padding: 0;
  }
  .quiet:hover { color: var(--ink); }
  .cream-btn {
    background: var(--cream);
    color: var(--charcoal);
    border: none;
    border-radius: 2px;
    padding: 10px 18px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
  }
  .cream-btn:hover { opacity: 0.92; }
  .cream-btn:disabled { opacity: 0.6; cursor: wait; }
  .hero {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 0 28px;
    transition: padding 0.35s ease;
  }
  body.sheet-open .hero { padding-right: min(33.33vw, 440px); }
  .hero-line {
    font-family: "Bodoni Moda", Georgia, serif;
    font-weight: 500;
    font-size: clamp(2.1rem, 5vw, 3.6rem);
    letter-spacing: -0.015em;
    line-height: 1.15;
    color: var(--ink);
  }
  .hero-note {
    margin-top: 16px;
    color: var(--stone);
    font-size: clamp(0.92rem, 1.6vw, 1.05rem);
    font-weight: 400;
  }
  .sheet {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 33.333vw;
    min-width: 300px;
    max-width: 440px;
    z-index: 8;
    background: var(--panel);
    border-left: 1px solid rgba(196, 165, 116, 0.28);
    box-shadow: -18px 0 50px rgba(0, 0, 0, 0.45);
    transform: translateX(100%);
    transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1);
    padding: 56px 32px 32px;
    overflow: auto;
  }
  .sheet.open { transform: translateX(0); }
  .sheet-close {
    position: absolute;
    top: 22px;
    right: 22px;
    background: none;
    border: none;
    color: var(--stone);
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
  }
  .sheet-close:hover { color: var(--ink); }
  .sheet h2 {
    font-family: "Bodoni Moda", Georgia, serif;
    font-weight: 500;
    font-size: 1.7rem;
    margin-bottom: 28px;
  }
  form { display: flex; flex-direction: column; gap: 16px; }
  label {
    display: block;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 6px;
  }
  input[type="email"],
  input[type="password"],
  input[type="text"] {
    width: 100%;
    background: var(--charcoal);
    color: var(--ink);
    border: 1px solid rgba(196, 165, 116, 0.22);
    border-radius: 2px;
    padding: 12px 12px;
    outline: none;
  }
  input:focus { border-color: var(--gold); }
  .age {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--stone);
    font-size: 0.88rem;
  }
  .age input { accent-color: var(--gold); width: 16px; height: 16px; }
  .sheet .cream-btn { width: 100%; padding: 13px; }
  .forgot {
    display: block;
    text-align: center;
    margin-top: -4px;
    font-size: 0.72rem;
    color: var(--stone);
    opacity: 0.8;
    text-decoration: none;
  }
  .forgot:hover { color: var(--ink); }
  .switch {
    margin-top: 18px;
    text-align: center;
  }
  .switch button {
    background: none;
    border: none;
    color: var(--stone);
    font-size: 0.84rem;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .switch button:hover { color: var(--ink); }
  .msg { min-height: 1.2em; font-size: 0.84rem; line-height: 1.4; }
  .msg.error { color: var(--rose); }
  .msg.ok { color: var(--gold); }
  @media (max-width: 760px) {
    .house-bar { padding: 20px 18px; }
    .sheet { width: 100%; min-width: 0; max-width: none; }
    body.sheet-open .hero { padding-right: 28px; }
  }
</style>
</head>
<body>
<img class="night-still" src="assets/IMG_3547.jpeg" alt="">
<div class="night-shade"></div>

<header class="house-bar">
  <div class="house-name">Keyhole</div>
  <div class="house-actions">
    <button type="button" class="quiet" id="nav-signin-btn">Sign in</button>
    <button type="button" class="cream-btn" id="nav-signup-btn">Create account</button>
  </div>
</header>

<main class="hero">
  <h1 class="hero-line">She’s here when you are.</h1>
  <p class="hero-note">Private sessions. Two rooms. Sign in to enter.</p>
</main>

<aside class="sheet" id="auth-panel" aria-label="Sign in or create account" aria-hidden="true">
  <button type="button" class="sheet-close" id="panel-close-btn" aria-label="Close">&times;</button>
  <h2 id="panel-title">Sign in</h2>
  <form id="auth-form" novalidate>
    <div id="name-group" style="display:none">
      <label for="display_name">Name</label>
      <input id="display_name" name="display_name" type="text" autocomplete="nickname">
    </div>
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="age" id="age-group" style="display:none">
      <input type="checkbox" id="age_gate" name="age_gate">
      <label for="age_gate" style="margin:0;letter-spacing:0;text-transform:none;font-size:0.88rem">I am 18 or older</label>
    </div>
    <button type="submit" class="cream-btn" id="submit-btn">Sign in</button>
    <a href="#" id="forgot-link" class="forgot">Forgot password</a>
    <div id="msg" class="msg" role="status"></div>
  </form>
  <div class="switch">
    <button type="button" id="toggle-link">New here? Create account</button>
  </div>
</aside>

<script>
(() => {
  const TOKEN_KEY = 'keyhole_auth_token_v1';
  const NEXT = 'rooms.html';
  if (localStorage.getItem(TOKEN_KEY)) {
    location.replace(NEXT);
    return;
  }

  const navSignin = document.getElementById('nav-signin-btn');
  const navSignup = document.getElementById('nav-signup-btn');
  const panel = document.getElementById('auth-panel');
  const closeBtn = document.getElementById('panel-close-btn');
  const panelTitle = document.getElementById('panel-title');
  const form = document.getElementById('auth-form');
  const nameGroup = document.getElementById('name-group');
  const ageGroup = document.getElementById('age-group');
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const displayName = document.getElementById('display_name');
  const ageGate = document.getElementById('age_gate');
  const submitBtn = document.getElementById('submit-btn');
  const toggleLink = document.getElementById('toggle-link');
  const forgotLink = document.getElementById('forgot-link');
  const msg = document.getElementById('msg');
  let mode = 'login';

  function say(text, kind) {
    msg.textContent = text || '';
    msg.className = 'msg' + (kind ? ' ' + kind : '');
  }

  function setMode(m) {
    mode = m;
    const signup = m === 'signup';
    panelTitle.textContent = signup ? 'Create account' : 'Sign in';
    nameGroup.style.display = signup ? 'block' : 'none';
    ageGroup.style.display = signup ? 'flex' : 'none';
    password.autocomplete = signup ? 'new-password' : 'current-password';
    submitBtn.textContent = signup ? 'Create account' : 'Sign in';
    toggleLink.textContent = signup ? 'Already have an account? Sign in' : 'New here? Create account';
    say('');
  }

  function openPanel(m) {
    setMode(m);
    panel.classList.add('open');
    panel.setAttribute('aria-hidden', 'false');
    document.body.classList.add('sheet-open');
    setTimeout(() => email.focus(), 80);
  }

  function closePanel() {
    panel.classList.remove('open');
    panel.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('sheet-open');
  }

  async function api(path, body) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    let data = {};
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) {
      const detail = data.detail;
      const text = typeof detail === 'string' ? detail : (Array.isArray(detail) ? (detail[0] && detail[0].msg) : '') || ('Request failed (' + res.status + ')');
      const err = new Error(text);
      err.status = res.status;
      throw err;
    }
    return data;
  }

  navSignin.addEventListener('click', () => openPanel('login'));
  navSignup.addEventListener('click', () => openPanel('signup'));
  closeBtn.addEventListener('click', closePanel);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePanel();
  });
  toggleLink.addEventListener('click', () => setMode(mode === 'signup' ? 'login' : 'signup'));

  forgotLink.addEventListener('click', async (e) => {
    e.preventDefault();
    if (!email.value.trim()) return say('Enter your email first.', 'error');
    try {
      await api('/auth/resend-verification', { email: email.value.trim() });
      say('Check ' + email.value.trim() + ' for a link.', 'ok');
    } catch (err) {
      say(err.message, 'error');
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const em = email.value.trim();
    const pw = password.value;
    if (!em || !pw) return say('Email and password are required.', 'error');
    if (mode === 'signup' && !ageGate.checked) return say('You must confirm you are 18 or older.', 'error');
    submitBtn.disabled = true;
    say('');
    try {
      if (mode === 'signup') {
        const res = await api('/auth/signup', {
          email: em,
          password: pw,
          display_name: displayName.value.trim() || em.split('@')[0]
        });
        if (res.needs_verification) {
          setMode('login');
          say('Check ' + em + ' for a verification link, then sign in.', 'ok');
          return;
        }
      }
      const data = await api('/auth/login', { email: em, password: pw });
      localStorage.setItem(TOKEN_KEY, data.token);
      location.replace(NEXT);
    } catch (err) {
      say(err.message || 'Could not sign in.', 'error');
    } finally {
      submitBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
